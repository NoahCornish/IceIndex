
# ============================================================
# ICEINDEX DATA ENGINE
# AUTOMATED DATA REFRESH
# Version: 0.6.0
# ============================================================
#
# Master R script:
#   scripts/refresh.R
#
# Configuration:
#   scripts/config.R
#
# Purpose:
#   Automatically refresh all IceIndex datasets.
#
# ============================================================

name: Refresh IceIndex Data

on:
  # ==========================================================
  # AUTOMATIC DAILY REFRESH
  # ==========================================================

  schedule:
    # Runs daily at 11:00 UTC
    # 6:00 AM EST / 7:00 AM EDT
    - cron: "0 11 * * *"

  # ==========================================================
  # MANUAL REFRESH
  # ==========================================================

  workflow_dispatch:

# ============================================================
# PERMISSIONS
# ============================================================

permissions:
  contents: write

# ============================================================
# CONCURRENCY
# ============================================================

concurrency:
  group: iceindex-data-refresh
  cancel-in-progress: false

# ============================================================
# JOBS
# ============================================================

jobs:

  refresh-data:

    name: Refresh OHL Datasets

    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:

      # ======================================================
      # STEP 1: CHECKOUT REPOSITORY
      # ======================================================

      - name: Checkout IceIndex
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # ======================================================
      # STEP 2: SET UP R
      # ======================================================

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # ======================================================
      # STEP 3: INSTALL SYSTEM DEPENDENCIES
      # ======================================================

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev

      # ======================================================
      # STEP 4: INSTALL R PACKAGES
      # ======================================================

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(
            c(
              "httr2",
              "jsonlite"
            ),
            repos = "https://cloud.r-project.org"
          )'

      # ======================================================
      # STEP 5: VERIFY PROJECT STRUCTURE
      # ======================================================

      - name: Verify IceIndex scripts
        run: |
          echo "Checking required IceIndex files..."

          test -f scripts/config.R
          test -f scripts/api_client.R
          test -f scripts/refresh.R
          test -f scripts/collect_seasons.R

          echo "All required scripts found."

      # ======================================================
      # STEP 6: RUN MASTER DATA REFRESH
      # ======================================================

      - name: Refresh all IceIndex datasets
        run: |
          echo "Starting IceIndex Data Engine..."

          Rscript scripts/refresh.R

          echo "IceIndex data refresh completed."

      # ======================================================
      # STEP 7: DISPLAY GENERATED DATA
      # ======================================================

      - name: Display refreshed datasets
        run: |
          echo "Generated data files:"

          if [ -d data ]; then
            find data -type f | sort
          else
            echo "No data directory found."
          fi

      # ======================================================
      # STEP 8: COMMIT UPDATED DATA
      # ======================================================

      - name: Commit refreshed datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then

            echo "No dataset changes detected."
            echo "Repository already up to date."

          else

            echo "Dataset changes detected."

            git commit \
              -m "data: automated IceIndex refresh"

            git push

            echo "Updated datasets committed successfully."

          fi

      # ======================================================
      # STEP 9: SUCCESS MESSAGE
      # ======================================================

      - name: Refresh summary
        run: |
          echo "========================================"
          echo " ICEINDEX DATA ENGINE"
          echo " REFRESH COMPLETE"
          echo "========================================"
          echo " All enabled collectors executed."
          echo " Data committed if changes were found."
          echo "========================================"
