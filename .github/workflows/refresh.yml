
# ============================================================
# ICEINDEX DATA ENGINE
# AUTOMATED DATA REFRESH
# Version: 0.8.0
# ============================================================
#
# Master script:
#   scripts/refresh.R
#
# Configuration:
#   scripts/config.R
#
# Refresh targets (America/Toronto):
#   03:06
#   12:02
#   18:03
#   22:25
#
# OHLpkg:
#   Installed fresh from the public GitHub repository.
#   Latest main-branch code is used on every refresh.
#
# ============================================================

name: Refresh IceIndex Data

# ============================================================
# TRIGGERS
# ============================================================

on:
  schedule:

    # 3:06 AM Eastern
    - cron: "6 7,8 * * *"

    # 12:02 PM Eastern
    - cron: "2 16,17 * * *"

    # 6:03 PM Eastern
    - cron: "3 22,23 * * *"

    # 10:25 PM Eastern
    - cron: "25 2,3 * * *"

  workflow_dispatch:

# ============================================================
# PERMISSIONS
# ============================================================

permissions:
  contents: write

# ============================================================
# CONCURRENCY
# ============================================================

concurrency:
  group: iceindex-data-refresh
  cancel-in-progress: false

# ============================================================
# JOBS
# ============================================================

jobs:
  refresh-data:
    name: Refresh OHL Datasets
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ======================================================
      # STEP 1: CHECK EASTERN REFRESH SCHEDULE
      # ======================================================

      - name: Check Eastern refresh schedule
        id: eastern-time
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "Manual refresh requested."
            echo "run_refresh=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Each cron expression contains two possible
          # UTC hours: one for EDT and one for EST.
          #
          # Evaluate both candidate scheduled UTC times
          # against America/Toronto.
          #
          # This avoids checking only the runner's current
          # hour, which can be incorrect when GitHub starts
          # a scheduled job late.

          case "$SCHEDULE" in
            "6 7,8 * * *")
              candidate_hours="7 8"
              target_local="03:06"
              target_minute="06"
              ;;

            "2 16,17 * * *")
              candidate_hours="16 17"
              target_local="12:02"
              target_minute="02"
              ;;

            "3 22,23 * * *")
              candidate_hours="22 23"
              target_local="18:03"
              target_minute="03"
              ;;

            "25 2,3 * * *")
              candidate_hours="2 3"
              target_local="22:25"
              target_minute="25"
              ;;

            *)
              echo "ERROR: Unrecognized schedule."
              exit 1
              ;;
          esac

          now_epoch=$(date -u +%s)
          approved=false

          # Search recent scheduled occurrences.
          # The matching occurrence must be within
          # the previous 2 hours.
          #
          # This is a best-effort allowance for
          # GitHub Actions scheduling delays.

          for days_ago in 0 1; do
            utc_date=$(date -u -d \
              "$days_ago days ago" +%Y-%m-%d)

            for hour in $candidate_hours; do
              padded_hour=$(printf "%02d" "$hour")

              candidate_utc="${utc_date}T${padded_hour}:${target_minute}:00Z"

              candidate_epoch=$(date -u -d \
                "$candidate_utc" +%s)

              age_seconds=$((now_epoch - candidate_epoch))

              # Ignore future occurrences and runs
              # delayed by more than two hours.

              if (( age_seconds < 0 || age_seconds > 7200 )); then
                continue
              fi

              actual_local=$(TZ=America/Toronto \
                date -d "@$candidate_epoch" +%H:%M)

              echo "Candidate UTC: $candidate_utc"
              echo "Candidate Eastern: $actual_local"
              echo "Expected Eastern: $target_local"

              if [[ "$actual_local" == "$target_local" ]]; then
                approved=true
                break 2
              fi
            done
          done

          if [[ "$approved" == "true" ]]; then
            echo "Scheduled Eastern refresh approved."
            echo "run_refresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "Inactive EST/EDT occurrence."
            echo "run_refresh=false" >> "$GITHUB_OUTPUT"
          fi

      # ======================================================
      # STEP 2: CHECKOUT ICEINDEX
      # ======================================================

      - name: Checkout IceIndex
        if: steps.eastern-time.outputs.run_refresh == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # ======================================================
      # STEP 3: SET UP R
      # ======================================================

      - name: Set up R
        if: steps.eastern-time.outputs.run_refresh == 'true'
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # ======================================================
      # STEP 4: INSTALL SYSTEM DEPENDENCIES
      # ======================================================

      - name: Install system dependencies
        if: steps.eastern-time.outputs.run_refresh == 'true'
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libgit2-dev

      # ======================================================
      # STEP 5: INSTALL R PACKAGES AND LATEST OHLPKG
      # ======================================================

      - name: Install R packages and latest OHLpkg
        if: steps.eastern-time.outputs.run_refresh == 'true'
        shell: bash
        env:
          GITHUB_PAT: ""
          GITHUB_TOKEN: ""
        run: |
          set -euo pipefail

          echo "========================================"
          echo " ICEINDEX PACKAGE INSTALLATION"
          echo "========================================"

          Rscript - <<'RSCRIPT'
          options(
            repos = c(
              CRAN = "https://cloud.r-project.org"
            ),
            timeout = 300
          )

          # ----------------------------------------------
          # INSTALL CORE R PACKAGES
          # ----------------------------------------------

          required <- c(
            "httr2",
            "jsonlite",
            "remotes"
          )

          missing <- required[
            !vapply(
              required,
              requireNamespace,
              logical(1),
              quietly = TRUE
            )
          ]

          if (length(missing) > 0) {
            install.packages(missing)
          }

          # ----------------------------------------------
          # INSTALL LATEST PUBLIC OHLPKG
          # ----------------------------------------------

          # Download directly from GitHub's public
          # archive endpoint instead of using the
          # GitHub API or an authentication token.

          package_url <- paste0(
            "https://github.com/NoahCornish/",
            "OHLpkg/archive/refs/heads/main.tar.gz"
          )

          cat("Downloading latest OHLpkg...\n")

          remotes::install_url(
            package_url,
            dependencies = NA,
            upgrade = "never",
            quiet = FALSE
          )

          # ----------------------------------------------
          # VERIFY REQUIRED PACKAGES
          # ----------------------------------------------

          required_packages <- c(
            "httr2",
            "jsonlite",
            "OHLpkg"
          )

          missing_packages <- required_packages[
            !vapply(
              required_packages,
              requireNamespace,
              logical(1),
              quietly = TRUE
            )
          ]

          if (length(missing_packages) > 0) {
            stop(
              "Missing R packages: ",
              paste(
                missing_packages,
                collapse = ", "
              )
            )
          }

          cat(
            "OHLpkg version:",
            as.character(packageVersion("OHLpkg")),
            "\n"
          )

          cat("R package verification passed.\n")
          RSCRIPT

          echo "========================================"
          echo " PACKAGE INSTALLATION COMPLETE"
          echo "========================================"

      # ======================================================
      # STEP 6: VERIFY PROJECT STRUCTURE
      # ======================================================

      - name: Verify IceIndex scripts
        if: steps.eastern-time.outputs.run_refresh == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo " ICEINDEX PROJECT VERIFICATION"
          echo "========================================"

          test -f scripts/config.R
          test -f scripts/api_client.R
          test -f scripts/refresh.R

          echo "Core scripts verified."

          test -f scripts/league/ohl/collect_seasons.R
          test -f scripts/league/ohl/collect_teams.R
          test -f scripts/league/ohl/collect_players.R
          test -f scripts/league/ohl/collect_skater_stats.R
          test -f scripts/league/ohl/collect_goalie_stats.R

          echo "All five OHL collectors verified."

          test -f scripts/processing/ohl_process_all.R

          echo "OHL processing script verified."

      # ======================================================
      # STEP 7: RUN MASTER REFRESH
      # ======================================================

      - name: Refresh all IceIndex datasets
        if: steps.eastern-time.outputs.run_refresh == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo " ICEINDEX DATA ENGINE"
          echo " STARTING REFRESH"
          echo "========================================"

          Rscript scripts/refresh.R

          echo "========================================"
          echo " MASTER REFRESH COMPLETED"
          echo "========================================"

      # ======================================================
      # STEP 8: VERIFY REFRESH TIMESTAMP
      # ======================================================

      - name: Verify last successful refresh timestamp
        if: steps.eastern-time.outputs.run_refresh == 'true'
        shell: bash
        run: |
          set -euo pipefail

          Rscript - <<'RSCRIPT'
          path <- "data/ohl/metadata/last_updated.json"

          if (!file.exists(path)) {
            stop(
              "Missing last_updated.json. ",
              "Check scripts/refresh.R."
            )
          }

          metadata <- jsonlite::fromJSON(path)

          if (
            is.null(metadata$last_updated_utc) ||
            length(metadata$last_updated_utc) != 1 ||
            is.na(metadata$last_updated_utc) ||
            !nzchar(metadata$last_updated_utc)
          ) {
            stop("Missing or invalid last_updated_utc.")
          }

          timestamp <- as.POSIXct(
            metadata$last_updated_utc,
            format = "%Y-%m-%dT%H:%M:%SZ",
            tz = "UTC"
          )

          if (is.na(timestamp)) {
            stop("Invalid UTC timestamp format.")
          }

          cat(
            "Last successful refresh:",
            metadata$last_updated_utc,
            "\n"
          )

          cat("Refresh metadata verified.\n")
          RSCRIPT

      # ======================================================
      # STEP 9: DISPLAY DATA INVENTORY
      # ======================================================

      - name: Display refreshed datasets
        if: steps.eastern-time.outputs.run_refresh == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo " ICEINDEX DATA INVENTORY"
          echo "========================================"

          if [ -d data ]; then
            find data -type f | sort
          else
            echo "ERROR: Data directory missing."
            exit 1
          fi

          echo "========================================"
          echo " DATA INVENTORY COMPLETE"
          echo "========================================"

      # ======================================================
      # STEP 10: COMMIT REFRESHED DATA
      # ======================================================

      - name: Commit refreshed datasets
        if: steps.eastern-time.outputs.run_refresh == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo " ICEINDEX DATA PUBLICATION"
          echo "========================================"

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No dataset changes detected."
            echo "Repository already up to date."
          else
            echo "Dataset changes detected."

            git commit \
              -m "data: automated IceIndex refresh"

            git push

            echo "Updated datasets committed successfully."
          fi

      # ======================================================
      # STEP 11: REFRESH SUMMARY
      # ======================================================

      - name: Refresh summary
        if: steps.eastern-time.outputs.run_refresh == 'true'
        shell: bash
        run: |
          echo "========================================"
          echo " ICEINDEX DATA ENGINE"
          echo " REFRESH COMPLETE"
          echo "========================================"
          echo " OHL collectors executed."
          echo " Latest OHLpkg installed."
          echo " Processing completed."
          echo " Refresh timestamp verified."
          echo " Data committed if changes were found."
          echo "========================================"