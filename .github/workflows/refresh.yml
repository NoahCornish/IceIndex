
# ============================================================
# ICEINDEX DATA ENGINE
# AUTOMATED DATA REFRESH
# Version: 0.8.0
# ============================================================
#
# Master script:
#   scripts/refresh.R
#
# Configuration:
#   scripts/config.R
#
# Refresh targets (America/Toronto):
#   03:06
#   12:02
#   18:03
#   22:25
#
# OHLpkg:
#   Installed fresh from the public GitHub repository.
#   Latest main-branch code is used on every refresh.
#
# ============================================================

name: Refresh IceIndex Data

# ============================================================
# TRIGGERS
# ============================================================

on:
  schedule:

    # 3:06 AM Eastern
    - cron: "6 7,8 * * *"

    # 12:02 PM Eastern
    - cron: "2 16,17 * * *"

    # 6:03 PM Eastern
    - cron: "3 22,23 * * *"

    # 10:25 PM Eastern
    - cron: "25 2,3 * * *"

  workflow_dispatch:

# ============================================================
# PERMISSIONS
# ============================================================

permissions:
  contents: write

# ============================================================
# CONCURRENCY
# ============================================================

concurrency:
  group: iceindex-data-refresh
  cancel-in-progress: false

# ============================================================
# JOBS
# ============================================================

jobs:
  refresh-data:
    name: Refresh OHL Datasets
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ======================================================
      # STEP 1: CHECK EASTERN REFRESH SCHEDULE
      # ======================================================

      - name: Check Eastern refresh schedule
        id: eastern-time
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "Manual refresh requested."
            echo "run_refresh=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # GitHub Actions cron uses UTC. Each expression covers
          # both the EDT and EST candidate hours. Determine which
          # occurrence is active based on Eastern local time.
          # GitHub does not expose the exact scheduled-fire timestamp,
          # so the closest past matching UTC occurrence is used.
          case "$SCHEDULE" in
            "6 7,8 * * *")   hours="7 8";   minute=6;  expected="03:06" ;;
            "2 16,17 * * *") hours="16 17"; minute=2;  expected="12:02" ;;
            "3 22,23 * * *") hours="22 23"; minute=3;  expected="18:03" ;;
            "25 2,3 * * *")  hours="2 3";   minute=25; expected="22:25" ;;
            *) echo "Unknown cron expression: $SCHEDULE" >&2; exit 1 ;;
          esac

          now=$(date -u +%s)
          closest_epoch=0
          closest_utc=""
          for day in 0 1; do
            utc_day=$(date -u -d "$day days ago" +%Y-%m-%d)
            for hour in $hours; do
              candidate=$(printf '%sT%02d:%02d:00Z' "$utc_day" "$hour" "$minute")
              epoch=$(date -u -d "$candidate" +%s)
              if (( epoch <= now && epoch > closest_epoch )); then
                closest_epoch=$epoch
                closest_utc=$candidate
              fi
            done
          done

          if (( closest_epoch == 0 )); then
            echo "No matching past UTC occurrence." >&2
            exit 1
          fi

          local_time=$(TZ=America/Toronto date -d "@$closest_epoch" +%H:%M)
          delay=$((now - closest_epoch))
          echo "Closest scheduled UTC occurrence: $closest_utc"
          echo "Corresponding Eastern time: $local_time"
          echo "Expected Eastern time: $expected"
          echo "Elapsed since occurrence: ${delay}s"

          # Reject an inactive DST occurrence, or a very stale job.
          # Scheduled jobs delayed beyond one hour cannot be reliably
          # attributed to a specific occurrence from GitHub's payload.
          if [[ "$local_time" == "$expected" ]] && (( delay <= 3599 )); then
            echo "Scheduled Eastern refresh approved."
            echo "run_refresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "Inactive or delayed EST/EDT occurrence; no refresh."
            echo "run_refresh=false" >> "$GITHUB_OUTPUT"
          fi

      # ======================================================
      # STEP 2: CHECKOUT ICEINDEX
      # ======================================================

      - name: Checkout IceIndex
        if: steps.eastern-time.outputs.run_refresh == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # ======================================================
      # STEP 3: SET UP R
      # ======================================================

      - name: Set up R
        if: steps.eastern-time.outputs.run_refresh == 'true'
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # ======================================================
      # STEP 4: INSTALL SYSTEM DEPENDENCIES
      # ======================================================

      - name: Install system dependencies
        if: steps.eastern-time.outputs.run_refresh == 'true'
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libgit2-dev

      # ======================================================
      # STEP 5: INSTALL R PACKAGES AND LATEST OHLPKG
      # ======================================================

      - name: Install R packages and latest OHLpkg
        if: steps.eastern-time.outputs.run_refresh == 'true'
        shell: bash
        env:
          GITHUB_PAT: ""
          GITHUB_TOKEN: ""
        run: |
          set -euo pipefail

          echo "========================================"
          echo " ICEINDEX PACKAGE INSTALLATION"
          echo "========================================"

          Rscript - <<'RSCRIPT'
          options(
            repos = c(
              CRAN = "https://cloud.r-project.org"
            ),
            timeout = 300
          )

          # ----------------------------------------------
          # INSTALL CORE R PACKAGES
          # ----------------------------------------------

          required <- c(
            "httr2",
            "jsonlite",
            "remotes"
          )

          missing <- required[
            !vapply(
              required,
              requireNamespace,
              logical(1),
              quietly = TRUE
            )
          ]

          if (length(missing) > 0) {
            install.packages(missing)
          }

          # ----------------------------------------------
          # INSTALL LATEST PUBLIC OHLPKG
          # ----------------------------------------------

          # Download directly from GitHub's public
          # archive endpoint instead of using the
          # GitHub API or an authentication token.

          package_url <- paste0(
            "https://github.com/NoahCornish/",
            "OHLpkg/archive/refs/heads/main.tar.gz"
          )

          cat("Downloading latest OHLpkg...\n")

          remotes::install_url(
            package_url,
            dependencies = NA,
            upgrade = "never",
            quiet = FALSE
          )

          # ----------------------------------------------
          # VERIFY REQUIRED PACKAGES
          # ----------------------------------------------

          required_packages <- c(
            "httr2",
            "jsonlite",
            "OHLpkg"
          )

          missing_packages <- required_packages[
            !vapply(
              required_packages,
              requireNamespace,
              logical(1),
              quietly = TRUE
            )
          ]

          if (length(missing_packages) > 0) {
            stop(
              "Missing R packages: ",
              paste(
                missing_packages,
                collapse = ", "
              )
            )
          }

          cat(
            "OHLpkg version:",
            as.character(packageVersion("OHLpkg")),
            "\n"
          )

          cat("R package verification passed.\n")
          RSCRIPT

          echo "========================================"
          echo " PACKAGE INSTALLATION COMPLETE"
          echo "========================================"

      # ======================================================
      # STEP 6: VERIFY PROJECT STRUCTURE
      # ======================================================

      - name: Verify IceIndex scripts
        if: steps.eastern-time.outputs.run_refresh == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo " ICEINDEX PROJECT VERIFICATION"
          echo "========================================"

          test -f scripts/config.R
          test -f scripts/api_client.R
          test -f scripts/refresh.R

          echo "Core scripts verified."

          test -f scripts/league/ohl/collect_seasons.R
          test -f scripts/league/ohl/collect_teams.R
          test -f scripts/league/ohl/collect_players.R
          test -f scripts/league/ohl/collect_skater_stats.R
          test -f scripts/league/ohl/collect_goalie_stats.R

          echo "All five OHL collectors verified."

          test -f scripts/processing/ohl_process_all.R

          echo "OHL processing script verified."

      # ======================================================
      # STEP 7: RUN MASTER REFRESH
      # ======================================================

      - name: Refresh all IceIndex datasets
        if: steps.eastern-time.outputs.run_refresh == 'true'
        shell: bash
        run: |
          set -euo pipefail
          date -u +%Y-%m-%dT%H:%M:%SZ > "$RUNNER_TEMP/iceindex_refresh_started_utc"

          echo "========================================"
          echo " ICEINDEX DATA ENGINE"
          echo " STARTING REFRESH"
          echo "========================================"

          Rscript scripts/refresh.R

          echo "========================================"
          echo " MASTER REFRESH COMPLETED"
          echo "========================================"

      # ======================================================
      # STEP 8: VERIFY REFRESH TIMESTAMP
      # ======================================================

      - name: Verify last successful refresh timestamp
        if: steps.eastern-time.outputs.run_refresh == 'true'
        shell: bash
        run: |
          set -euo pipefail

          Rscript - <<'RSCRIPT'
          path <- "data/ohl/metadata/last_updated.json"

          if (!file.exists(path)) {
            stop(
              "Missing last_updated.json. ",
              "Check scripts/refresh.R."
            )
          }

          metadata <- jsonlite::fromJSON(path)

          if (
            is.null(metadata$last_updated_utc) ||
            length(metadata$last_updated_utc) != 1 ||
            is.na(metadata$last_updated_utc) ||
            !nzchar(metadata$last_updated_utc)
          ) {
            stop("Missing or invalid last_updated_utc.")
          }

          timestamp <- as.POSIXct(
            metadata$last_updated_utc,
            format = "%Y-%m-%dT%H:%M:%SZ",
            tz = "UTC"
          )

          if (is.na(timestamp)) {
            stop("Invalid UTC timestamp format.")
          }

          cat(
            "Last successful refresh:",
            metadata$last_updated_utc,
            "\n"
          )

          started <- as.POSIXct(
            readLines(file.path(Sys.getenv("RUNNER_TEMP"), "iceindex_refresh_started_utc"), warn = FALSE),
            format = "%Y-%m-%dT%H:%M:%SZ", tz = "UTC"
          )
          if (is.na(started) || timestamp < started - 60) {
            stop("Refresh timestamp is stale; scripts/refresh.R did not record a new successful refresh.")
          }
          cat("Refresh metadata verified and current.\n")
          RSCRIPT

      # ======================================================
      # STEP 9: DISPLAY DATA INVENTORY
      # ======================================================

      - name: Display refreshed datasets
        if: steps.eastern-time.outputs.run_refresh == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo " ICEINDEX DATA INVENTORY"
          echo "========================================"

          if [ -d data ]; then
            find data -type f | sort
          else
            echo "ERROR: Data directory missing."
            exit 1
          fi

          echo "========================================"
          echo " DATA INVENTORY COMPLETE"
          echo "========================================"

      # ======================================================
      # STEP 10: COMMIT REFRESHED DATA
      # ======================================================

      - name: Commit refreshed datasets
        if: steps.eastern-time.outputs.run_refresh == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo " ICEINDEX DATA PUBLICATION"
          echo "========================================"

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No dataset changes detected."
            echo "Repository already up to date."
          else
            echo "Dataset changes detected."

            git commit \
              -m "data: automated IceIndex refresh"

            git push origin HEAD:main

            echo "Updated datasets committed successfully."
          fi

      # ======================================================
      # STEP 11: REFRESH SUMMARY
      # ======================================================

      - name: Refresh summary
        if: steps.eastern-time.outputs.run_refresh == 'true'
        shell: bash
        run: |
          echo "========================================"
          echo " ICEINDEX DATA ENGINE"
          echo " REFRESH COMPLETE"
          echo "========================================"
          echo " OHL collectors executed."
          echo " Latest OHLpkg installed."
          echo " Processing completed."
          echo " Refresh timestamp verified."
          echo " Data committed if changes were found."
          echo "========================================"