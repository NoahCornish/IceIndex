
# ============================================================
# ICEINDEX DATA ENGINE
# AUTOMATED DATA REFRESH
# Version: 0.7.0
# ============================================================
#
# Master script:
#   scripts/refresh.R
#
# Configuration:
#   scripts/config.R
#
# Daily Eastern refresh targets:
#   3:06 AM
#   12:02 PM
#   6:03 PM
#   10:25 PM
#
# Automatically handles EST / EDT.
#
# ============================================================

name: Refresh IceIndex Data

# ============================================================
# TRIGGERS
# ============================================================

on:

  schedule:

    # 3:06 AM Eastern
    - cron: "6 7,8 * * *"

    # 12:02 PM Eastern
    - cron: "2 16,17 * * *"

    # 6:03 PM Eastern
    - cron: "3 22,23 * * *"

    # 10:25 PM Eastern
    - cron: "25 2,3 * * *"

  workflow_dispatch:

# ============================================================
# PERMISSIONS
# ============================================================

permissions:
  contents: write

# ============================================================
# CONCURRENCY
# ============================================================

concurrency:
  group: iceindex-data-refresh
  cancel-in-progress: false

# ============================================================
# JOBS
# ============================================================

jobs:

  refresh-data:

    name: Refresh OHL Datasets

    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:

      # ======================================================
      # STEP 1: CHECK EASTERN REFRESH SCHEDULE
      # ======================================================

      - name: Check Eastern refresh schedule
        id: eastern-time
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "Manual refresh requested."
            echo "run_refresh=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # GitHub schedules use UTC.
          # The paired hours represent EST and EDT.
          #
          # Compare the scheduled occurrence with the
          # applicable Eastern UTC offset.
          #
          # GitHub does not expose the exact scheduled
          # execution timestamp, so this uses the current
          # date and scheduled UTC hour as an approximation.

          offset=$(TZ=America/Toronto date +%z)

          if [[ "$offset" == "-0400" ]]; then
            season="EDT"
          else
            season="EST"
          fi

          echo "Eastern timezone: $season"
          echo "Triggered schedule: $SCHEDULE"
          echo "Runner started: $(date -u)"

          case "$SCHEDULE" in

            "6 7,8 * * *")
              target_minute="06"
              if [[ "$season" == "EDT" ]]; then
                target_hour="07"
              else
                target_hour="08"
              fi
              ;;

            "2 16,17 * * *")
              target_minute="02"
              if [[ "$season" == "EDT" ]]; then
                target_hour="16"
              else
                target_hour="17"
              fi
              ;;

            "3 22,23 * * *")
              target_minute="03"
              if [[ "$season" == "EDT" ]]; then
                target_hour="22"
              else
                target_hour="23"
              fi
              ;;

            "25 2,3 * * *")
              target_minute="25"
              if [[ "$season" == "EDT" ]]; then
                target_hour="02"
              else
                target_hour="03"
              fi
              ;;

            *)
              echo "Unknown cron schedule."
              exit 1
              ;;

          esac

          current_hour=$(date -u +%H)

          echo "Expected UTC hour: $target_hour"
          echo "Current UTC hour: $current_hour"

          # Allow execution within the scheduled hour
          # or the following hour if GitHub starts late.
          #
          # This is a best-effort safeguard against
          # GitHub Actions scheduling delays.

          next_hour=$(printf "%02d" \
            $(( (10#$target_hour + 1) % 24 )))

          if [[ "$current_hour" == "$target_hour" ]] ||
             [[ "$current_hour" == "$next_hour" ]]; then

            echo "Scheduled refresh approved."
            echo "run_refresh=true" >> "$GITHUB_OUTPUT"

          else

            echo "Inactive EST/EDT schedule occurrence."
            echo "run_refresh=false" >> "$GITHUB_OUTPUT"

          fi

      # ======================================================
      # STEP 2: CHECKOUT REPOSITORY
      # ======================================================

      - name: Checkout IceIndex
        if: steps.eastern-time.outputs.run_refresh == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # ======================================================
      # STEP 3: SET UP R
      # ======================================================

      - name: Set up R
        if: steps.eastern-time.outputs.run_refresh == 'true'
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # ======================================================
      # STEP 4: INSTALL SYSTEM DEPENDENCIES
      # ======================================================

      - name: Install system dependencies
        if: steps.eastern-time.outputs.run_refresh == 'true'
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libgit2-dev

      # ======================================================
      # STEP 5: INSTALL R PACKAGES AND OHLPKG
      # ======================================================

      - name: Install R packages
        if: steps.eastern-time.outputs.run_refresh == 'true'
        run: |
          Rscript -e '
            options(
              repos = c(
                CRAN = "https://cloud.r-project.org"
              )
            )

            cat("Installing IceIndex dependencies...\n")

            install.packages(
              c(
                "httr2",
                "jsonlite",
                "remotes"
              )
            )

            cat("Installing NoahCornish/OHLpkg...\n")

            remotes::install_github(
              "NoahCornish/OHLpkg",
              dependencies = TRUE,
              upgrade = "never"
            )

            required <- c(
              "httr2",
              "jsonlite",
              "OHLpkg"
            )

            missing <- required[
              !vapply(
                required,
                requireNamespace,
                logical(1),
                quietly = TRUE
              )
            ]

            if (length(missing) > 0) {
              stop(
                "Missing R packages: ",
                paste(missing, collapse = ", ")
              )
            }

            cat(
              "OHLpkg version:",
              as.character(packageVersion("OHLpkg")),
              "\n"
            )

            cat("All required R packages verified.\n")
          '

      # ======================================================
      # STEP 6: VERIFY PROJECT STRUCTURE
      # ======================================================

      - name: Verify IceIndex scripts
        if: steps.eastern-time.outputs.run_refresh == 'true'
        run: |
          set -e

          echo "========================================"
          echo " ICEINDEX PROJECT VERIFICATION"
          echo "========================================"

          test -f scripts/config.R
          test -f scripts/api_client.R
          test -f scripts/refresh.R

          echo "Core scripts verified."

          test -f scripts/league/ohl/collect_seasons.R
          test -f scripts/league/ohl/collect_teams.R
          test -f scripts/league/ohl/collect_players.R
          test -f scripts/league/ohl/collect_skater_stats.R
          test -f scripts/league/ohl/collect_goalie_stats.R

          echo "All five OHL collectors verified."

          test -f scripts/processing/ohl_process_all.R

          echo "OHL processing script verified."

          echo "========================================"
          echo " PROJECT STRUCTURE VERIFIED"
          echo "========================================"

      # ======================================================
      # STEP 7: RUN MASTER DATA REFRESH
      # ======================================================

      - name: Refresh all IceIndex datasets
        if: steps.eastern-time.outputs.run_refresh == 'true'
        run: |
          set -e

          echo "========================================"
          echo " ICEINDEX DATA ENGINE"
          echo " STARTING REFRESH"
          echo "========================================"

          Rscript scripts/refresh.R

          echo "========================================"
          echo " MASTER REFRESH COMPLETED"
          echo "========================================"

      # ======================================================
      # STEP 8: VERIFY REFRESH TIMESTAMP
      # ======================================================

      - name: Verify last successful refresh timestamp
        if: steps.eastern-time.outputs.run_refresh == 'true'
        run: |
          Rscript -e '
            path <- "data/ohl/metadata/last_updated.json"

            if (!file.exists(path)) {
              stop(
                "Missing last_updated.json. ",
                "Check scripts/refresh.R."
              )
            }

            metadata <- jsonlite::fromJSON(path)

            if (
              is.null(metadata$last_updated_utc) ||
              length(metadata$last_updated_utc) != 1 ||
              is.na(metadata$last_updated_utc) ||
              !nzchar(metadata$last_updated_utc)
            ) {
              stop(
                "Missing or invalid last_updated_utc."
              )
            }

            timestamp <- as.POSIXct(
              metadata$last_updated_utc,
              format = "%Y-%m-%dT%H:%M:%SZ",
              tz = "UTC"
            )

            if (is.na(timestamp)) {
              stop("Invalid UTC timestamp format.")
            }

            cat(
              "Last successful refresh:",
              metadata$last_updated_utc,
              "\n"
            )

            cat("Refresh metadata verified.\n")
          '

      # ======================================================
      # STEP 9: DISPLAY REFRESHED DATA
      # ======================================================

      - name: Display refreshed datasets
        if: steps.eastern-time.outputs.run_refresh == 'true'
        run: |
          set -e

          echo "========================================"
          echo " ICEINDEX DATA INVENTORY"
          echo "========================================"

          if [ -d data ]; then

            find data -type f | sort

          else

            echo "ERROR: Data directory missing."
            exit 1

          fi

          echo "========================================"
          echo " DATA INVENTORY COMPLETE"
          echo "========================================"

      # ======================================================
      # STEP 10: COMMIT REFRESHED DATA
      # ======================================================

      - name: Commit refreshed datasets
        if: steps.eastern-time.outputs.run_refresh == 'true'
        run: |
          set -e

          echo "========================================"
          echo " ICEINDEX DATA PUBLICATION"
          echo "========================================"

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then

            echo "No dataset changes detected."
            echo "Repository already up to date."

          else

            echo "Dataset changes detected."

            git commit \
              -m "data: automated IceIndex refresh"

            git push

            echo "Updated datasets committed successfully."

          fi

      # ======================================================
      # STEP 11: REFRESH SUMMARY
      # ======================================================

      - name: Refresh summary
        if: steps.eastern-time.outputs.run_refresh == 'true'
        run: |
          echo "========================================"
          echo " ICEINDEX DATA ENGINE"
          echo " REFRESH COMPLETE"
          echo "========================================"
          echo " OHL collectors executed."
          echo " OHLpkg installed and verified."
          echo " Processing completed."
          echo " Refresh timestamp verified."
          echo " Data committed if changes were found."
          echo "========================================"