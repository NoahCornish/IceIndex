
# ============================================================
# ICEINDEX DATA ENGINE
# AUTOMATED DATA REFRESH
# Version: 0.7.0
# ============================================================
#
# Master script:
#   scripts/refresh.R
#
# Schedule:
#   3:06 AM Eastern
#   12:02 PM Eastern
#   6:03 PM Eastern
#   10:25 PM Eastern
#
# Automatically adjusts for EST / EDT.
#
# ============================================================

name: Refresh IceIndex Data

on:

  # ==========================================================
  # AUTOMATIC REFRESH SCHEDULE
  # ==========================================================

  schedule:

    # 3:06 AM Eastern
    - cron: "6 7,8 * * *"

    # 12:02 PM Eastern
    - cron: "2 16,17 * * *"

    # 6:03 PM Eastern
    - cron: "3 22,23 * * *"

    # 10:25 PM Eastern
    - cron: "25 2,3 * * *"

  # ==========================================================
  # MANUAL REFRESH
  # ==========================================================

  workflow_dispatch:

# ============================================================
# PERMISSIONS
# ============================================================

permissions:
  contents: write

# ============================================================
# CONCURRENCY
# ============================================================

concurrency:
  group: iceindex-data-refresh
  cancel-in-progress: false

# ============================================================
# JOBS
# ============================================================

jobs:

  refresh-data:

    name: Refresh OHL Datasets

    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:

      # ======================================================
      # STEP 1: CHECK EASTERN REFRESH SCHEDULE
      # ======================================================

      - name: Check Eastern refresh schedule
        id: eastern-time
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "Manual refresh requested."
            echo "run_refresh=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Use the scheduled UTC hour, not the runner start
          # minute, because GitHub Actions can start late.
          #
          # 2026-01-15 is standard time (EST).
          # 2026-07-15 is daylight time (EDT).
          #
          # For a schedule to be eligible, its corresponding
          # Eastern target must match the current UTC offset.

          utc_offset=$(TZ=America/Toronto date +%z)

          case "$SCHEDULE" in

            "6 7,8 * * *")
              if [[ "$utc_offset" == "-0400" ]]; then
                target_hour="07"
              else
                target_hour="08"
              fi
              target_minute="06"
              ;;

            "2 16,17 * * *")
              if [[ "$utc_offset" == "-0400" ]]; then
                target_hour="16"
              else
                target_hour="17"
              fi
              target_minute="02"
              ;;

            "3 22,23 * * *")
              if [[ "$utc_offset" == "-0400" ]]; then
                target_hour="22"
              else
                target_hour="23"
              fi
              target_minute="03"
              ;;

            "25 2,3 * * *")
              if [[ "$utc_offset" == "-0400" ]]; then
                target_hour="02"
              else
                target_hour="03"
              fi
              target_minute="25"
              ;;

            *)
              echo "Unknown scheduled cron expression."
              exit 1
              ;;

          esac

          # The workflow uses two possible UTC hours for
          # each Eastern time. We determine the correct hour
          # using the scheduled time and timezone offset.
          #
          # GitHub does not provide the exact scheduled
          # occurrence timestamp as a built-in context.
          # Therefore we use the current UTC date/hour as
          # a practical approximation for delayed runs.

          current_utc_hour=$(date -u +%H)
          current_utc_minute=$(date -u +%M)

          echo "Schedule: $SCHEDULE"
          echo "Eastern UTC offset: $utc_offset"
          echo "Expected UTC hour: $target_hour"
          echo "Current UTC: $(date -u)"

          if [[ "$current_utc_hour" == "$target_hour" ]]; then
            echo "Scheduled refresh approved."
            echo "run_refresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "Inactive EST/EDT schedule occurrence."
            echo "run_refresh=false" >> "$GITHUB_OUTPUT"
          fi

      # ======================================================
      # STEP 2: CHECKOUT REPOSITORY
      # ======================================================

      - name: Checkout IceIndex
        if: steps.eastern-time.outputs.run_refresh == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # ======================================================
      # STEP 3: SET UP R
      # ======================================================

      - name: Set up R
        if: steps.eastern-time.outputs.run_refresh == 'true'
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # ======================================================
      # STEP 4: INSTALL SYSTEM DEPENDENCIES
      # ======================================================

      - name: Install system dependencies
        if: steps.eastern-time.outputs.run_refresh == 'true'
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev

      # ======================================================
      # STEP 5: INSTALL R PACKAGES
      # ======================================================

      - name: Install R packages
        if: steps.eastern-time.outputs.run_refresh == 'true'
        run: |
          Rscript -e 'install.packages(
            c(
              "httr2",
              "jsonlite"
            ),
            repos = "https://cloud.r-project.org"
          )'

      # ======================================================
      # STEP 6: VERIFY PROJECT STRUCTURE
      # ======================================================

      - name: Verify IceIndex scripts
        if: steps.eastern-time.outputs.run_refresh == 'true'
        run: |
          set -e

          echo "========================================"
          echo " ICEINDEX PROJECT VERIFICATION"
          echo "========================================"

          test -f scripts/config.R
          test -f scripts/api_client.R
          test -f scripts/refresh.R

          echo "Core scripts verified."

          test -f scripts/league/ohl/collect_seasons.R
          test -f scripts/league/ohl/collect_teams.R
          test -f scripts/league/ohl/collect_players.R
          test -f scripts/league/ohl/collect_skater_stats.R
          test -f scripts/league/ohl/collect_goalie_stats.R

          echo "All five OHL collectors verified."

          test -f scripts/processing/ohl_process_all.R

          echo "Processing script verified."

      # ======================================================
      # STEP 7: RUN MASTER REFRESH
      # ======================================================

      - name: Refresh all IceIndex datasets
        if: steps.eastern-time.outputs.run_refresh == 'true'
        run: |
          echo "========================================"
          echo " ICEINDEX DATA ENGINE"
          echo " STARTING REFRESH"
          echo "========================================"

          Rscript scripts/refresh.R

          echo "========================================"
          echo " DATA REFRESH COMPLETED"
          echo "========================================"

      # ======================================================
      # STEP 8: VERIFY REFRESH TIMESTAMP
      # ======================================================

      - name: Verify last successful refresh timestamp
        if: steps.eastern-time.outputs.run_refresh == 'true'
        run: |
          Rscript -e '
            path <- "data/ohl/metadata/last_updated.json"

            if (!file.exists(path)) {
              stop("Missing last_updated.json")
            }

            metadata <- jsonlite::fromJSON(path)

            if (
              is.null(metadata$last_updated_utc) ||
              length(metadata$last_updated_utc) != 1 ||
              is.na(metadata$last_updated_utc) ||
              !nzchar(metadata$last_updated_utc)
            ) {
              stop("Invalid last_updated_utc timestamp")
            }

            timestamp <- as.POSIXct(
              metadata$last_updated_utc,
              format = "%Y-%m-%dT%H:%M:%SZ",
              tz = "UTC"
            )

            if (is.na(timestamp)) {
              stop("Invalid UTC timestamp format")
            }

            cat(
              "Last successful refresh:",
              metadata$last_updated_utc,
              "\n"
            )
          '

      # ======================================================
      # STEP 9: DISPLAY DATA INVENTORY
      # ======================================================

      - name: Display refreshed datasets
        if: steps.eastern-time.outputs.run_refresh == 'true'
        run: |
          echo "========================================"
          echo " ICEINDEX DATA INVENTORY"
          echo "========================================"

          if [ -d data ]; then
            find data -type f | sort
          else
            echo "ERROR: Data directory missing."
            exit 1
          fi

      # ======================================================
      # STEP 10: COMMIT UPDATED DATA
      # ======================================================

      - name: Commit refreshed datasets
        if: steps.eastern-time.outputs.run_refresh == 'true'
        run: |
          set -e

          echo "========================================"
          echo " ICEINDEX DATA PUBLICATION"
          echo "========================================"

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then

            echo "No dataset changes detected."
            echo "Repository already up to date."

          else

            echo "Dataset changes detected."

            git commit \
              -m "data: automated IceIndex refresh"

            git push

            echo "Updated datasets committed successfully."

          fi

      # ======================================================
      # STEP 11: SUCCESS MESSAGE
      # ======================================================

      - name: Refresh summary
        if: steps.eastern-time.outputs.run_refresh == 'true'
        run: |
          echo "========================================"
          echo " ICEINDEX DATA ENGINE"
          echo " REFRESH COMPLETE"
          echo "========================================"
          echo " OHL collectors executed."
          echo " Processing completed."
          echo " Refresh timestamp verified."
          echo " Data committed if changes were found."
          echo "========================================"