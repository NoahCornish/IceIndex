    stroke="#5d88a5"
    stroke-width="3"/>

  <path d="M106 126
           Q160 102 214 126"
        fill="none"
        stroke="#78d5ff"
        stroke-opacity=".45"
        stroke-width="5"/>

  <!-- Face shadow -->

  <path
    d="M110 153
       C110 201 131 233 160 233
       C189 233 210 201 210 153
       Q160 141 110 153Z"
    fill="#29455d"/>

  <!-- Helmet visor -->

  <path
    d="M105 151
       Q160 137 215 151
       L209 172
       Q160 160 111 172Z"
    fill="#0a1728"
    fill-opacity=".88"
    stroke="#78d5ff"
    stroke-opacity=".35"
    stroke-width="2"/>

  <!-- Chin guard -->

  <path
    d="M122 180
       L133 214
       L160 225
       L187 214
       L198 180"
    fill="none"
    stroke="#8eb1c8"
    stroke-opacity=".45"
    stroke-width="3"/>

  <path d="M133 214L187 214"
        stroke="#8eb1c8"
        stroke-opacity=".4"
        stroke-width="3"/>

  <!-- Jersey collar -->

  <path
    d="M123 232
       L160 263
       L197 232"
    fill="none"
    stroke="#78d5ff"
    stroke-opacity=".7"
