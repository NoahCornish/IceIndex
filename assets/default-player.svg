    <path d="M160 296V336"/>
    <path d="M140 316H180"/>
    <path d="M146 302L174 330"/>
    <path d="M174 302L146 330"/>

  </g>

  <circle cx="160" cy="316" r="4"
          fill="#78d5ff"/>

  <!-- Footer identity -->

  <rect x="0" y="358"
        width="320" height="22"
        fill="#08111e"
        fill-opacity=".8"/>

  <text x="160" y="373"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="9"
        font-weight="700"
        letter-spacing="3"
        fill="#91b3cb">
