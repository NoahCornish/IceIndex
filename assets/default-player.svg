
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 320 380"
     role="img"
     aria-label="IceIndex default hockey player">

  <defs>
    <linearGradient id="background"
                    x1="0" y1="0"
                    x2="1" y2="1">
      <stop offset="0%" stop-color="#254562"/>
      <stop offset="100%" stop-color="#0a1728"/>
    </linearGradient>

    <linearGradient id="jersey"
                    x1="0" y1="0"
                    x2="1" y2="1">
      <stop offset="0%" stop-color="#345c7b"/>
      <stop offset="100%" stop-color="#152b43"/>
    </linearGradient>

    <linearGradient id="helmet"
                    x1="0" y1="0"
                    x2="0" y2="1">
      <stop offset="0%" stop-color="#426b89"/>
      <stop offset="100%" stop-color="#1b344c"/>
    </linearGradient>
  </defs>

  <rect width="320" height="380"
        fill="url(#background)"/>

  <!-- Background geometry -->

  <circle cx="160" cy="155" r="125"
          fill="none"
          stroke="#78d5ff"
          stroke-opacity=".08"
          stroke-width="2"/>

  <circle cx="160" cy="155" r="94"
          fill="none"
          stroke="#78d5ff"
          stroke-opacity=".08"
          stroke-width="2"/>

  <path d="M0 290L320 115"
        stroke="#78d5ff"
        stroke-opacity=".07"
        stroke-width="35"/>

  <!-- Shoulders and jersey -->

  <path
    d="M92 243
       C60 253 34 272 20 318
       L0 380
       H320
       L300 318
       C286 272 260 253 228 243
       L193 225
       H127Z"
    fill="url(#jersey)"/>

  <path d="M0 351H320"
        stroke="#78d5ff"
        stroke-opacity=".35"
        stroke-width="7"/>

  <path d="M0 369H320"
        stroke="#78d5ff"
        stroke-opacity=".15"
        stroke-width="5"/>

  <!-- Neck -->

  <path d="M133 212V251
           Q160 273 187 251
           V212Z"
        fill="#213c55"/>

  <!-- Helmet -->

  <path
    d="M96 138
       C96 83 121 56 160 56
       C199 56 224 83 224 138
       L217 166
       H103Z"
