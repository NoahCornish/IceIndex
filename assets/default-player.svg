  <!-- IceIndex chest emblem -->

  <circle cx="160" cy="316" r="28"
          fill="#0b1c2f"
          stroke="#78d5ff"
          stroke-opacity=".5"
          stroke-width="2"/>

  <g stroke="#78d5ff"
